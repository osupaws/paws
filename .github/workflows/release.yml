name: Build and Release Paws

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            rid: win-x64
            target: --win
          - os: ubuntu-latest
            rid: linux-x64
            target: --linux
          - os: macos-latest
            rid: osx-x64
            target: --mac

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Backend
        run: |
          dotnet publish Paws.DotNet/Paws.Host/Paws.Host.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o published_backend /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:DebugType=None

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install

      - name: Build and Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAWS_BACKEND_PATH: "../published_backend"
        run: |
          cd frontend
          pnpm run build:backend
          pnpm run build
          npx electron-builder build ${{ matrix.target }} --publish always
