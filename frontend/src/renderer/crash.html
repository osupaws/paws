<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
		/>
		<title>Paws - Critical Error</title>
		<style>
			body {
				margin: 0;
				padding: 0;
				background-color: #1a1a1a;
				color: #ffffff;
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
				user-select: none;
				-webkit-app-region: drag;
			}

			.container {
				text-align: center;
				background: #252525;
				padding: 40px;
				border-radius: 12px;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
				max-width: 400px;
				border: 1px solid #333;
			}

			.icon {
				font-size: 48px;
				margin-bottom: 20px;
				display: block;
			}

			h1 {
				margin: 0 0 10px;
				font-size: 24px;
				font-weight: 600;
			}

			p {
				margin: 0 0 30px;
				color: #aaa;
				font-size: 14px;
				line-height: 1.5;
			}

			.actions {
				-webkit-app-region: no-drag;
				display: flex;
				gap: 10px;
				justify-content: center;
			}

			button {
				padding: 10px 20px;
				border: none;
				border-radius: 6px;
				font-size: 14px;
				font-weight: 500;
				cursor: pointer;
				transition: all 0.2s;
				outline: none;
			}

			.btn-primary {
				background-color: #ff6b6b;
				color: white;
			}

			.btn-primary:hover {
				background-color: #ff5252;
			}

			.btn-secondary {
				background-color: #333;
				color: #ddd;
			}

			.btn-secondary:hover {
				background-color: #444;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<span class="icon">💔</span>
			<h1>Connection Lost</h1>
			<p>
				The Paws backend service has stopped unexpectedly.<br />
				Please restart the application to continue.
			</p>
			<div class="actions">
				<!-- Quit Button -->
				<button class="btn-secondary" onclick="window.close()">Quit</button>

				<!-- Restart Button (Actually just quits for now, user reopens) -->
				<!-- In a real scenario, we might use IPC to trigger a full app relaunch -->
				<button class="btn-primary" onclick="window.api.electron.relaunch()">Restart Paws</button>
			</div>
		</div>

		<script>
			// Simple script to expose relaunch via IPC if not already standard
			// Assuming we have access to window.api from preload
			// If not, we might need a simple crash-preload.js or just rely on 'electron' bridge
		</script>
	</body>
</html>
